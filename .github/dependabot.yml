version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The gtk-rs bindings share one release train and only build together.
      gtk-rs:
        patterns:
          - "gtk4"
          - "gdk4*"
          - "libadwaita"
          - "glib"
          - "gio"
          - "gdk-pixbuf"
          - "pango"
          - "cairo-rs"
          - "graphene-rs"
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
