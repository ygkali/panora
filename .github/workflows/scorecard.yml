name: OpenSSF Scorecard

# Supply-chain hygiene score for the repository (branch protection, pinned
# dependencies, token permissions, ...). Results go to the code-scanning
# tab and, for the default branch, to the public Scorecard API.

on:
  push:
    branches: [main]
  schedule:
    - cron: "33 5 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
