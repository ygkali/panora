name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs build without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb dbus-x11 xclip
      - name: Workspace tests (headless; X11 tests self-skip)
        run: cargo test --workspace
      - name: X11 backend integration tests under Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -ac &
          sleep 1
          DISPLAY=:99 dbus-run-session -- cargo test -p panod --test x11_integration -- --test-threads=1
        env:
          DISPLAY: :99

  keyring:
    name: Secret Service Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gnome-keyring dbus-daemon
      - name: Master key round trip through gnome-keyring
        run: bash scripts/keyring-test.sh

  wayland:
    name: Wayland backend on headless sway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev sway wl-clipboard gnome-keyring dbus-daemon
      - name: Capture, recall, private mode, persistence through data-control
        run: bash scripts/wayland-e2e.sh

  gui-smoke:
    name: Popup renders under Xvfb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb dbus-x11 x11-utils imagemagick \
            adwaita-icon-theme librsvg2-common
      - name: Render the popup from the fixture data
        run: bash scripts/capture-screenshots.sh shots
      - name: The shots must show a window, not a blank screen
        run: |
          for f in shots/*.png; do
            size=$(stat -c %s "$f")
            echo "$f: $size bytes"
            test "$size" -gt 10000
          done
      - uses: actions/upload-artifact@v7
        with:
          name: popup-screenshots
          path: shots/*.png

  msrv:
    name: MSRV (Rust 1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version is an input, not the action ref, so a bot bumping the
      # ref cannot silently raise the floor `Cargo.toml` promises.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo check --workspace --all-targets --locked

  shell:
    name: Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh uninstall.sh test-local.sh KUR.sh TEST.sh KALDIR.sh \
            packaging/build-deb.sh packaging/make-kit.sh \
            scripts/panora-doctor scripts/e2e-test.sh scripts/security-check.sh scripts/keyring-test.sh
      - name: bash -n
        run: |
          for f in install.sh uninstall.sh test-local.sh packaging/*.sh scripts/panora-doctor scripts/*.sh; do
            bash -n "$f"
          done
      - name: Scripts stay LF
        run: |
          ! grep -rlI $'\r' install.sh uninstall.sh test-local.sh packaging scripts gnome-extension

  extension-security:
    name: GNOME Extension Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/extension-security-check.mjs
      - run: cp gnome-extension/extension.js "$RUNNER_TEMP/extension.mjs" && node --check "$RUNNER_TEMP/extension.mjs"
      - name: Verify no extension network primitives
        run: |
          ! grep -REn 'https?://|\b(fetch|XMLHttpRequest|WebSocket|eval)\s*\(' gnome-extension

  audit:
    name: RustSec Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny (licenses, bans & advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./Cargo.toml

  package:
    name: Debian Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [fmt-clippy, test, extension-security, audit, deny, shell]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev binutils libglib2.0-bin \
            lintian desktop-file-utils appstream
      - name: Verify lockfile
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/io.github.ygkali.Panora.desktop
          appstreamcli validate --no-net packaging/io.github.ygkali.Panora.metainfo.xml
      - name: Build .deb
        run: ./packaging/build-deb.sh
      - name: Inspect package
        run: |
          dpkg-deb --contents dist/panora_*.deb
          dpkg-deb --field dist/panora_*.deb Depends Recommends Suggests
      - name: lintian
        run: lintian --fail-on error,warning --tag-display-limit 0 dist/panora_*.deb
      - name: Install and smoke-test the package
        run: |
          sudo apt-get install -y ./dist/panora_*.deb
          panora-cli --version
          panod --version
          panora-gui --version
          panora-doctor --json | head -c 400; echo
          man -w panora-cli panod panora-gui panora-doctor
      - uses: actions/upload-artifact@v7
        with:
          name: panora-deb-${{ matrix.arch }}
          path: dist/panora_*.deb
