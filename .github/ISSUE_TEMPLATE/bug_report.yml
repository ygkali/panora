name: Bug report
description: Something does not work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste clipboard content that is private; `panora-doctor --json` output contains none.
  - type: input
    id: version
    attributes:
      label: Panora version
      description: Output of `panora-cli --version`
      placeholder: panora-cli 1.3.0
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: Zorin OS 18, GNOME 46, Wayland
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: panora-doctor output
      description: Paste the output of `panora-doctor` (or `panora-doctor --json`).
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy an image in Firefox
        2. Press Super+V
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Daemon log
      description: "`journalctl --user -u panod.service -n 50 --no-pager`"
      render: text
