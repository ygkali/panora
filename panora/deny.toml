[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# `vulnerability` and `notice` were removed from this section: every security
# advisory now fails the check unconditionally, and exceptions go in `ignore`.
yanked = "deny"
# `unmaintained` is a scope now, not a lint level. "workspace" fails on crates
# Panora depends on directly -- those we can actually swap out -- and leaves
# transitive ones to the crates that pull them in.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "OpenSSL",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
