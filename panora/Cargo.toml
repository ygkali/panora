[workspace]
resolver = "2"
members = [
    "crates/panora-core",
    "crates/panod",
    "crates/panora-gui",
    "crates/panora-cli",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/panora-clipboard/panora"
homepage = "https://github.com/panora-clipboard/panora"
description = "Secure, lightweight, extensible clipboard manager for Debian-based desktops (GNOME-first)"

[workspace.dependencies]
# --- async runtime ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "fs", "signal"] }
async-trait = "0.1"
futures = "0.3"

# --- storage ---
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"

# --- crypto ---
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# --- serialization / errors ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- X11 ---
x11rb = { version = "0.13", features = ["xfixes"] }

# --- D-Bus ---
zbus = { version = "4", features = ["tokio"] }

# --- config ---
directories = "5"
toml = "0.8"

[profile.release]
opt-level = 2          # dengeli: boyut/hiz; dusuk RAM hedefi
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
