[workspace]
resolver = "2"
members = [
    "crates/panora-core",
    "crates/panod",
    "crates/panora-gui",
    "crates/panora-cli",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-only"
# Panora ships as a .deb built from this tree, never as crates.io packages.
# Saying so stops an accidental `cargo publish` and lets the members depend on
# each other by path alone (see `allow-wildcard-paths` in deny.toml).
publish = false
repository = "https://github.com/ygkali/panora"
homepage = "https://github.com/ygkali/panora"
description = "Secure, lightweight, extensible clipboard manager for Debian-based desktops (GNOME-first)"

[workspace.dependencies]
# --- async runtime ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "fs", "signal"] }
async-trait = "0.1"
futures = "0.3"

# --- storage ---
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"

# --- crypto ---
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# --- text filters (user-defined ignore patterns) ---
regex = "1"

# --- serialization / errors ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- X11 ---
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }

# --- Wayland (native data-control; no wl-clipboard subprocesses) ---
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# --- D-Bus ---
# zbus 5 to match oo7: on zbus 4 the tree ends up carrying both major versions,
# since even oo7 0.5 already depends on zbus 5.
zbus = { version = "5", features = ["tokio"] }
# Secret Service client. native_crypto keeps the DH session handshake on
# RustCrypto instead of linking OpenSSL.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

# --- images (thumbnails for the popup; decoders only, no encoders beyond PNG) ---
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

# --- config ---
directories = "5"
toml = "0.8"

# --- CLI ---
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
clap_complete = "4"
clap_mangen = "0.2"

[profile.release]
opt-level = 2          # dengeli: boyut/hiz; dusuk RAM hedefi
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
