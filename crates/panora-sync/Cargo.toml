[package]
name = "panora-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Panora device sync: pairing, device roster and group key (the LAN transport process follows in SYNC-04)"

[dependencies]
panora-core = { path = "../panora-core" }
ring.workspace = true
blake3.workspace = true
rand.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "net", "time"] }
